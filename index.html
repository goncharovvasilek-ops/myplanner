<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LinkBoard">
<meta name="theme-color" content="#15171b">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>LinkBoard</title>
</head>
<body>
<div id="board">
  <div id="world">
    <svg id="ghostLinks" class="links"></svg>
    <div id="ghostCards"></div>
    <svg id="activeLinks" class="links"></svg>
    <div id="activeCards"></div>
    <svg id="tempLink" class="links"><path d=""/></svg>
  </div>
</div>

<div id="hint" hidden>
  <b>Пустая доска</b>
  <span>＋ — новое звено (фото или текст)</span>
  <span>двойной тап по звену — выбрать</span>
  <span>тяните за красный кружок — ниточка</span>
  <span>два пальца — масштаб, один — сдвиг</span>
</div>

<header id="topbar">
  <div id="layerTabs"></div>
  <button id="layerLabel" type="button"></button>
</header>

<div id="transferBar" hidden>
  <span>Тапайте полупрозрачные звенья</span>
  <button type="button" class="btn small" id="trCancel">Отмена</button>
  <button type="button" class="btn small primary" id="trOk">Перенести</button>
</div>

<nav id="toolbar">
  <button type="button" data-act="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Звено</span></button>
  <button type="button" data-act="transfer"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg><span>Перенос</span></button>
  <button type="button" data-act="edit"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg><span>Правка</span></button>
  <button type="button" data-act="delete"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span>Удалить</span></button>
  <button type="button" data-act="fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Всё</span></button>
  <button type="button" data-act="menu"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg><span>Меню</span></button>
</nav>

<div id="toast" hidden></div>

<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="importInput" accept=".json,application/json" hidden>

<script src="app.js"></script>
</body>
</html>
